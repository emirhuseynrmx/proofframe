name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --release --test allocation_contract -- --test-threads=1
      - run: cargo test --locked --doc --all-features
      - run: cargo package --locked
      - name: Verify crates.io publication path
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --dry-run --locked

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # `cryptography` backs the acceptance signature. It is an optional extra of the
      # package, and the wheel below is installed with --no-deps, so it has to be named
      # here or the signing tests cannot run.
      #
      # Versions are pinned so a green run names what produced it. They are the ones
      # this matrix already resolved, read off a passing run rather than chosen: on
      # 3.10 pip resolves pandas 2.3.3 and on 3.11 and up it resolves 3.0.5, so pandas
      # carries a marker instead of one pin that would break a cell.
      - run: >
          python -m pip install
          pytest==9.1.1 pyarrow==25.0.1 polars==1.44.1 psutil==7.2.2 cryptography==50.0.1
          "pandas==3.0.5; python_version >= '3.11'"
          "pandas==2.3.3; python_version < '3.11'"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --out dist --compatibility pypi
      - run: python -m pip install --no-index --find-links dist --no-deps proofframe
      - run: python -m pytest -q --basetemp target/pytest-ci
      # Pinning the literal here meant every version bump broke CI on a line nobody
      # remembered. Read it from the project metadata instead.
      - name: Installed wheel reports the declared version
        run: >-
          python -c "import proofframe, pathlib;
          from scripts.verify_release_version import read_versions;
          expected = read_versions(pathlib.Path('.'))[1];
          assert proofframe.__version__ == expected, (proofframe.__version__, expected)"

  action:
    name: Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Built here and put on PATH, so the action runs against this commit rather
      # than against whatever is on PyPI. Its install step steps aside when it
      # finds an installation already there, which is the branch this exercises.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --out dist --compatibility pypi
      # Pinned, and the wheel goes in with --no-deps, the same way the matrix above
      # does it: an unlocked install here resolves whatever PyPI is serving today
      # and the run stops naming what produced it. Only the review path is
      # exercised, so the signing extra is not needed.
      - run: python -m pip install pyarrow==25.0.1
      - run: python -m pip install --no-index --find-links dist --no-deps proofframe

      - name: A delivery that matches the contract, and one that does not
        run: |
          set -euo pipefail
          mkdir -p action-fixtures
          cat > action-fixtures/clean.csv <<'CSV'
          user_id,email,score,status
          1,a@example.com,0.5,active
          2,b@example.com,0.9,paused
          3,c@example.com,0.2,active
          CSV
          cat > action-fixtures/dirty.csv <<'CSV'
          user_id,email,score,status
          1,a@example.com,0.5,active
          1,not-an-email,1.7,unknown
          3,c@example.com,0.2,active
          CSV

      - name: Review accepts the clean delivery
        id: clean
        uses: ./
        with:
          path: action-fixtures/clean.csv
          contract: examples/contract.json
          out: action-out-clean
          artifact-name: action-review-clean

      - name: Review refuses the dirty delivery
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          path: action-fixtures/dirty.csv
          contract: examples/contract.json
          out: action-out-dirty
          upload: 'false'

      - name: The two runs said what they were supposed to say
        env:
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
          CLEAN_VIOLATIONS: ${{ steps.clean.outputs.violation-count }}
          DIRTY_OUTCOME: ${{ steps.dirty.outcome }}
          DIRTY_STATUS: ${{ steps.dirty.outputs.status }}
          DIRTY_VIOLATIONS: ${{ steps.dirty.outputs.violation-count }}
        run: |
          set -euo pipefail
          fail() { echo "action: $1" >&2; exit 1; }
          [ "$CLEAN_STATUS" = valid ] || fail "clean run reported '$CLEAN_STATUS', expected valid"
          [ "$CLEAN_VIOLATIONS" = 0 ] || fail "clean run counted $CLEAN_VIOLATIONS violations"
          [ -f action-out-clean/summary.md ] || fail "clean run wrote no summary"
          [ "$DIRTY_OUTCOME" = failure ] || fail "dirty run did not fail the step"
          [ "$DIRTY_STATUS" = invalid ] || fail "dirty run reported '$DIRTY_STATUS', expected invalid"
          [ "${DIRTY_VIOLATIONS:-0}" -gt 0 ] || fail "dirty run counted no violations"
          echo "clean: $CLEAN_STATUS ($CLEAN_VIOLATIONS) · dirty: $DIRTY_STATUS ($DIRTY_VIOLATIONS)"

  python-quality:
    name: Python quality and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.85"
      # This job is 3.13 only, so every version here is a single pin. `ruff` is
      # pinned for the same reason as the rest: its lint set changes between
      # releases, and an unpinned linter makes a green run unrepeatable.
      - run: >
          python -m pip install
          maturin==1.15.0 pytest==9.1.1 pytest-cov==7.1.0 ruff==0.16.6 twine==7.0.0
          pyarrow==25.0.1 pandas==3.0.5 polars==1.44.1 psutil==7.2.2 cryptography==50.0.1
      - name: Build and install the native wheel
        run: |
          mkdir -p target/ci-wheel
          maturin build --release --locked --out target/ci-wheel --compatibility pypi
          python -m pip install --no-deps --force-reinstall target/ci-wheel/*.whl
      - run: ruff check python tests benchmarks scripts
      - run: python -m pytest -q --basetemp target/pytest-coverage --cov=proofframe --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Build and inspect source distributions
        run: |
          mkdir -p target/source-artifacts
          maturin sdist --out target/source-artifacts
          python scripts/source_artifacts.py \
            --output target/source-artifacts \
            --verify target/source-artifacts/proofframe-*.tar.gz
          python -m twine check target/source-artifacts/proofframe-*.tar.gz
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: true
          use_oidc: true

  miri:
    name: Miri-compatible core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri
      - run: "cargo +nightly miri test --lib miri_tests::"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [contract_json, receipt_json, partition_bytes, partition_manifest_json]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=1024

  benchmark-gate:
    name: Release benchmark gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.benchmark-artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.85"
      - run: python -m pip install ".[dev,benchmark]"
      - run: >-
          python benchmarks/release_gate.py
          --rows 100000
          --runs 7
          --warmups 1
          --output target/release-gate.json
      - id: benchmark-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-benchmark-${{ github.sha }}
          path: target/release-gate.json
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    name: Release evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, python, python-quality, miri, fuzz, benchmark-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Record the exact validated tag commit
        run: |
          jq -n \
            --arg schema "proofframe.release-evidence.v1" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg benchmark_digest "${{ needs.benchmark-gate.outputs.artifact-digest }}" \
            '{schema: $schema, sha: $sha, ref: $ref, ci_run_id: $run_id, benchmark_artifact_digest: $benchmark_digest, required_jobs: ["rust", "python", "python-quality", "miri", "fuzz", "benchmark-gate"]}' \
            > release-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 30

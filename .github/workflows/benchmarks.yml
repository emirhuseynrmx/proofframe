name: Release benchmarks

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Rows in the synthetic smoke fixture"
        required: false
        default: "100000"
      runs:
        description: "Measured runs per case (minimum 5)"
        required: false
        default: "5"
      perf:
        description: "Attempt Linux perf counters"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - run: python -m pip install ".[dev,benchmark]"
      - run: maturin develop --release --locked
      - name: Measure release cases
        shell: bash
        run: |
          PERF_FLAG=""
          if [[ "${{ inputs.perf }}" == "true" ]]; then PERF_FLAG="--perf"; fi
          python benchmarks/release_gate.py \
            --rows "${{ inputs.rows }}" \
            --runs "${{ inputs.runs }}" \
            --warmups 1 \
            --output target/release-gate.json \
            ${PERF_FLAG}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofframe-release-gate
          path: target/release-gate.json
          if-no-files-found: error

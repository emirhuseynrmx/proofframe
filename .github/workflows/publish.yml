name: Publish release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  gate:
    name: Verify exact tag commit CI evidence
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.event.workflow_run.head_sha }}
          path: release-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind the release to one annotated or lightweight version tag
        id: release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mapfile -t tags < <(git tag --points-at "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test "${#tags[@]}" -eq 1
          tag="${tags[0]}"
          test "$tag" = "$TAG"
          jq -e \
            --arg sha "$SHA" \
            --arg ref "refs/tags/$tag" \
            --arg run_id "$RUN_ID" \
            '.schema == "proofframe.release-evidence.v1" and .sha == $sha and .ref == $ref and .ci_run_id == $run_id and (.benchmark_artifact_digest | length > 0) and (.required_jobs | length == 6)' \
            release-evidence/release-evidence.json
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  wheels:
    name: Build ${{ matrix.platform.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: macos-14
            target: universal2-apple-darwin
          - runner: windows-latest
            target: x64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi
          manylinux: "2014"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Build and inspect clean source archives
        run: >-
          python scripts/source_artifacts.py
          --output source-dist
          --verify dist/proofframe-0.7.0.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-zip
          path: source-dist/*.zip
          if-no-files-found: error

  publish:
    needs: [gate, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proofframe/
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - run: python scripts/verify_release_version.py --tag "${{ needs.gate.outputs.tag }}"
      - run: python -m pip install twine
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Create deterministic package checksums
        shell: bash
        run: |
          mkdir -p release-metadata
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > release-metadata/SHA256SUMS
      - name: Generate SPDX JSON software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: release-metadata/proofframe.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest exact wheel and source-distribution subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: Bind the SPDX SBOM to every published package
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: "dist/*"
          sbom-path: release-metadata/proofframe.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata-${{ needs.gate.outputs.sha }}
          path: release-metadata
          if-no-files-found: error
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-crate:
    needs: [gate, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/proofframe
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-zip
          path: source-dist
      - name: Expand the CI-built source archive
        id: crate-source
        shell: bash
        run: |
          mkdir crate-source
          unzip -q source-dist/*.zip -d crate-source
          mapfile -t roots < <(find crate-source -mindepth 1 -maxdepth 1 -type d -name 'proofframe-*' -print)
          test "${#roots[@]}" -eq 1
          echo "root=${roots[0]}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.85"
      - name: Build the exact crates.io package
        working-directory: ${{ steps.crate-source.outputs.root }}
        run: cargo package --locked
      - name: Create deterministic crate checksum
        shell: bash
        working-directory: ${{ steps.crate-source.outputs.root }}
        run: |
          mkdir -p crate-release-metadata
          sha256sum target/package/*.crate > crate-release-metadata/crate-SHA256SUMS
      - name: Generate crate SPDX JSON software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.crate-source.outputs.root }}/target/package
          format: spdx-json
          output-file: ${{ steps.crate-source.outputs.root }}/crate-release-metadata/proofframe-crate.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the exact crates.io package
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "${{ steps.crate-source.outputs.root }}/target/package/*.crate"
      - name: Bind the crate SBOM to the published package
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: "${{ steps.crate-source.outputs.root }}/target/package/*.crate"
          sbom-path: ${{ steps.crate-source.outputs.root }}/crate-release-metadata/proofframe-crate.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crate-release-metadata-${{ needs.gate.outputs.sha }}
          path: ${{ steps.crate-source.outputs.root }}/crate-release-metadata
          if-no-files-found: error
      - name: Publish the CI-verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: ${{ steps.crate-source.outputs.root }}
        run: cargo publish --locked

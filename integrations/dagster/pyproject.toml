[build-system]
# Pinned: newer hatchling writes metadata 2.5, which the release job's twine 6.2
# rejects in `twine check`; bump the two together.
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "proofframe-dagster"
version = "0.7.2"
description = "ProofFrame acceptance checks for Dagster"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["dagster", "data-quality", "contracts", "arrow", "proofframe"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "proofframe>=0.7.2,<0.8",
  "dagster>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/emirhuseynrmx/proofframe"
Source = "https://github.com/emirhuseynrmx/proofframe/tree/main/integrations/dagster"

[tool.hatch.build.targets.wheel]
packages = ["proofframe_dagster"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofframe-airflow"
version = "0.7.2"
description = "ProofFrame acceptance operators for Apache Airflow"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "../../LICENSE" }
keywords = ["airflow", "data-quality", "contracts", "arrow", "proofframe"]
classifiers = [
  "Framework :: Apache Airflow",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "proofframe>=0.7.2,<0.8",
  "apache-airflow>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/emirhuseynrmx/proofframe"
Source = "https://github.com/emirhuseynrmx/proofframe/tree/main/integrations/airflow"

[tool.hatch.build.targets.wheel]
packages = ["proofframe_airflow"]

[build-system]
# Pinned: newer hatchling writes metadata 2.5, which the release job's twine 6.2
# rejects in `twine check`; bump the two together.
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "proofframe-airflow"
version = "0.7.2"
description = "ProofFrame acceptance operators for Apache Airflow"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["airflow", "data-quality", "contracts", "arrow", "proofframe"]
classifiers = [
  "Framework :: Apache Airflow",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "proofframe>=0.7.2,<0.8",
  # Upper-bounded deliberately. The operators import BaseOperator from
  # airflow.models, which is the Airflow 2 location; Airflow 3 moves the provider
  # surface to airflow.sdk. Claiming >=2.7 with no ceiling would tell a resolver
  # that Airflow 3 is supported when nothing here has been run against it. CI
  # tests 2.10.5; the ceiling lifts in the release that adds a 3.x job beside it.
  "apache-airflow>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/emirhuseynrmx/proofframe"
Source = "https://github.com/emirhuseynrmx/proofframe/tree/main/integrations/airflow"

[tool.hatch.build.targets.wheel]
packages = ["proofframe_airflow"]

# Automatic Analysis reads this file. It does not read sonar-project.properties,
# which is the scanner's file — a first attempt at this exclusion went there and
# was silently ignored, so the gate failed again on the same 132 lines.

# The review-parity fixtures are expected output, not source.
#
# Each one is a whole document the engine rendered, checked in so that any change
# to the renderer has to be admitted rather than discovered. Four of them describe
# four runs of the same review, so they share a head, a stylesheet and a page
# frame by construction — that is what makes them a byte-for-byte baseline. The
# duplication detector counted those shared frames as 132 of 172 lines and failed
# the gate at 4.1% against a 3% limit, which asked for the one change that would
# destroy what the fixtures are for.
#
# They are generated files. Nothing in them is written or maintained by hand, and
# a rule firing on one would be a finding about the renderer's output rather than
# about any code a person could go and fix.
sonar.exclusions=tests/support/review_parity/**

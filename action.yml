name: ProofFrame
description: Check a delivered CSV or Parquet file against a data contract, and decide whether to accept it.
author: Emir Hüseyin İnci

branding:
  icon: check-square
  color: blue

inputs:
  path:
    description: The CSV or Parquet file to check.
    required: true
  contract:
    description: Path to the contract JSON.
    required: true
  mode:
    description: >-
      `review` writes an offline HTML report, a Markdown summary, report JSON and
      Evidence V2, and fails on contract violations. `accept` produces a bound
      acceptance decision — accepted, rejected or unknown — and a verifiable bundle.
    required: false
    default: review
  policy:
    description: Path to the acceptance policy JSON. `accept` mode only.
    required: false
    default: ''
  csv-options:
    description: >-
      Path to a JSON file of explicit CSV reader settings — delimiter, encoding,
      decimal separator, column types, null tokens. Recorded in the bundle, so two
      systems reading the same file either agree or disagree visibly.
    required: false
    default: ''
  out:
    description: >-
      Directory the review is written into, or the file the acceptance bundle is
      written to. Existing paths are never overwritten.
    required: false
    default: proofframe-out
  max-samples:
    description: >-
      Finding samples to include. Zero by default: samples can carry values from
      your data into an artifact.
    required: false
    default: '0'
  references:
    description: Newline-separated `name=path` bindings for referential integrity rules.
    required: false
    default: ''
  version:
    description: >-
      ProofFrame version to install. Ignored when `proofframe` is already on PATH,
      which is how this repository tests the action against a build it just made.
    required: false
    default: 0.7.1
  summary:
    description: Write the run's Markdown summary into the job summary.
    required: false
    default: 'true'
  upload:
    description: Upload the review directory or acceptance bundle as an artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Name for the uploaded artifact.
    required: false
    default: proofframe
  fail-on-unknown:
    description: >-
      Fail the step when acceptance cannot complete — a missing file, a parse
      failure, an exhausted limit. Set to false to handle `unknown` yourself, for
      example to retry a delivery that has not landed.
    required: false
    default: 'true'

outputs:
  status:
    description: >-
      `accepted`, `rejected` or `unknown` in accept mode; `valid` or `invalid` in
      review mode.
    value: ${{ steps.run.outputs.status }}
  violation-count:
    description: Exact violation count, empty when the scan did not complete.
    value: ${{ steps.run.outputs.violation-count }}
  artifact:
    description: Path to the review directory or the acceptance bundle, empty if none was written.
    value: ${{ steps.run.outputs.artifact }}
  exit-code:
    description: The CLI's own exit code, whether or not this step was failed.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install ProofFrame ${{ inputs.version }}
      shell: bash
      env:
        PROOFFRAME_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # An installation already on PATH wins. It is how this repository tests the
        # action against the wheel it just built, and how a consumer pins a version
        # of their own without waiting for a release.
        if command -v proofframe >/dev/null 2>&1; then
          echo "proofframe: using $(command -v proofframe)"
          exit 0
        fi
        python -m pip install --disable-pip-version-check \
          "proofframe[signing]==${PROOFFRAME_VERSION#v}"

    - name: Run ProofFrame
      id: run
      shell: bash
      env:
        PF_MODE: ${{ inputs.mode }}
        PF_PATH: ${{ inputs.path }}
        PF_CONTRACT: ${{ inputs.contract }}
        PF_POLICY: ${{ inputs.policy }}
        PF_CSV_OPTIONS: ${{ inputs.csv-options }}
        PF_OUT: ${{ inputs.out }}
        PF_MAX_SAMPLES: ${{ inputs.max-samples }}
        PF_REFERENCES: ${{ inputs.references }}
        PF_SUMMARY: ${{ inputs.summary }}
        PF_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
      run: |
        set -uo pipefail
        # Inputs travel as environment variables. `${{ }}` is substituted before bash
        # reads the line, so a value carrying shell syntax would otherwise run as shell.
        case "$PF_MODE" in
          review|accept) ;;
          *) echo "proofframe: mode must be review or accept, got '$PF_MODE'" >&2; exit 2 ;;
        esac

        args=("$PF_MODE" "$PF_PATH" --contract "$PF_CONTRACT")
        if [ "$PF_MODE" = review ]; then
          args+=(--out "$PF_OUT" --max-samples "$PF_MAX_SAMPLES")
          while IFS= read -r binding; do
            [ -n "$binding" ] && args+=(--reference "$binding")
          done <<< "$PF_REFERENCES"
        else
          args+=(--output "$PF_OUT")
          [ -n "$PF_POLICY" ] && args+=(--policy "$PF_POLICY")
          [ -n "$PF_CSV_OPTIONS" ] && args+=(--csv-options "$PF_CSV_OPTIONS")
        fi

        set +e
        proofframe "${args[@]}" > proofframe-result.json
        code=$?
        set -e
        cat proofframe-result.json
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # The CLI prints its result to stdout and states the outcome in the exit
        # code: 0 accepted or valid, 1 rejected or violations found, 2 an unusable
        # request, 3 a scan that could not complete, 4 an exhausted output budget.
        status=""
        violations=""
        if [ "$PF_MODE" = accept ]; then
          case "$code" in
            0) status=accepted ;;
            1) status=rejected ;;
            3) status=unknown ;;
          esac
        else
          case "$code" in
            0) status=valid ;;
            1) status=invalid ;;
          esac
          violations=$(python -c "import json,sys;print(json.load(open('proofframe-result.json')).get('violation_count',''))" 2>/dev/null || true)
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "violation-count=$violations" >> "$GITHUB_OUTPUT"

        artifact=""
        [ -e "$PF_OUT" ] && artifact="$PF_OUT"
        echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

        if [ "$PF_SUMMARY" = true ]; then
          if [ -f "$PF_OUT/summary.md" ]; then
            cat "$PF_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$status" ]; then
            {
              echo "### ProofFrame"
              echo
              echo "\`$PF_PATH\` — **$status**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

        # An unusable request or an exhausted budget is always a failure. A scan that
        # could not complete is a failure by default, because a delivery nobody could
        # read is not a delivery that passed.
        case "$code" in
          0) exit 0 ;;
          3) [ "$PF_FAIL_ON_UNKNOWN" = true ] && exit 3 || exit 0 ;;
          *) exit "$code" ;;
        esac

    - name: Upload the ProofFrame artifact
      if: ${{ always() && inputs.upload == 'true' && steps.run.outputs.artifact != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.artifact }}
        if-no-files-found: error

sonar.projectKey=emirhuseynrmx_proofframe
sonar.organization=emirhuseynrmx

# The review-parity fixtures are expected output, not source.
#
# Each one is a whole HTML review the engine rendered, checked in so that any
# change to the renderer has to be admitted rather than discovered. Four of them
# describe four different runs of the same document, so they share a head, a
# stylesheet and a page frame on purpose — that is what makes them a byte-for-byte
# baseline. The duplication detector counted those shared frames as 132 duplicated
# lines and failed the gate at 4.1% against a 3% limit, which asked for the one
# change that would destroy what the fixtures are for.
#
# Only duplication is switched off for them. Every other rule still applies, and
# nothing else in the project is excluded.
sonar.cpd.exclusions=tests/support/review_parity/**
